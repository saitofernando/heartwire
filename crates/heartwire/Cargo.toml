[package]
name = "heartwire"
version.workspace = true
description = "Native Windows tray app that streams audio to the iPhone over the local network"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[features]
omarchy-backend = []
default = ["desktop-ui"]
desktop-ui = ["dep:eframe", "dep:tray-icon", "dep:winit", "dep:image"]

[[bin]]
name = "heartwire"
path = "src/main.rs"
required-features = ["desktop-ui"]

[[bin]]
name = "heartwire-backend"
path = "src/backend.rs"
required-features = ["omarchy-backend"]

[dependencies]
bridge-core = { path = "../bridge-core" }
eframe = { optional = true, version = "0.37", default-features = false, features = ["accesskit", "clipboard", "glow"] }
image = { optional = true, version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# The same window eframe creates; used to anchor the panel to the tray.
winit = { optional = true, version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { optional = true, version = "0.26", default-features = false, features = ["ksni"] }
auto-launch = "0.6"
dirs = "7"
eframe = { optional = true, version = "0.37", default-features = false, features = ["wayland", "x11", "default_fonts"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", optional = true }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.100"

[dev-dependencies]
rqrr = "0.10"

[build-dependencies]
winresource = "0.1"
