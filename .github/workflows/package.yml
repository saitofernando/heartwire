name: HeartWire — Pacote Windows / Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Dependências / Dependencies
        run: |
          npm ci
          cargo fetch --locked --target x86_64-pc-windows-msvc
          cmake --version
      - name: Verificar / Check
        run: |
          npm run release:check
          npm run test:ui
          npm run test:pwa
      - name: Rust — Formatação / Formatting
        run: cargo fmt --all --check
      - name: Rust — Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust — Testes / Tests
        run: cargo test --workspace --locked
      - name: Gerar instalador / Build installer
        run: pwsh -NoProfile -File scripts/package.ps1
      - name: SHA-256
        shell: pwsh
        run: |
          $installers = Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter 'HeartWire_*_x64-setup.exe'
          if ($installers.Count -ne 1) { throw 'Esperado exatamente um instalador HeartWire / Expected exactly one HeartWire installer' }
          $checksumLines = $installers | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name }
          Set-Content -LiteralPath target/release/bundle/nsis/SHA256SUMS.txt -Value $checksumLines -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: HeartWire-windows-x64
          path: |
            target/release/bundle/nsis/HeartWire_*_x64-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
